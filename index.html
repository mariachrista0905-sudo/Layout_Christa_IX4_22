<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 8px;
            padding: 0;
            border: 2px solid black;
            font-family: "Times New Roman", serif;
        }

        /* HEADER */
        .header {
            background-color: #bdbdff;
            padding: 20px;
            text-align: center;
            color: rgb(248, 248, 244);
        }

        .header h1 {
            font-size: 30px;
        }

        /* NAVIGATION BAR */
        .navbar {
            display: flex;
            background-color: rgb(30, 18, 9);
        }

        .navbar a {
            color: rgb(245, 245, 238);
            padding: 14px 16px;
            text-decoration: none;
            transition: 0.3s;
        }

        .navbar a:hover {
            background-color: #acb7eb;
            color: rgb(30, 18, 9);
        }

        /* ACTIVE MENU */
        .navbar a.active {
            background-color: #e8c8fe;
            color: rgb(30, 18, 9);
        }

        /* CONTENT */
        .content {
            background-color: rgb(241, 241, 236);
            padding: 10px;
        }

        iframe {
            width: 100%;
            height: 750px;
            border: none;
            display: block;
            background-color: rgb(243, 243, 234);
        }

        /* FOOTER */
        .footer {
            background-color: #b8b6d8;
            color: rgb(249, 249, 244);
            padding: 20px;
            text-align: center;
        }

        /* RESPONSIVE */
        @media screen and (max-width: 700px) {
            .navbar {
                flex-wrap: wrap;
            }

            .navbar a {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Website HTML</h1>
        <p></p>
    </div>

    <div class="navbar">
        <a href="biodata.html" target="isi" class="active"
            onclick="pilih(this)">Biodata</a>

        <a href="tablemerge.html" target="isi"
            onclick="pilih(this)">Tabel</a>

        <a href="Tugas_list.html" target="isi"
            onclick="pilih(this)">List</a>

        <a href="STS_TIK_94_22.html" target="isi"
            onclick="pilih(this)">STS</a>
        
    </div>
    <div class="row">

        <iframe src="STS_TIK_94_22.html" name="isi"></iframe>
    </div>

    <div class="footer">
        <p></p>
    </div>
</body>
</html>
